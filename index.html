<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<title>KhetKhata &amp; Fasal Doctor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  if (window.tailwind) {
    tailwind.config = { theme: { extend: { colors: { forest: '#1B5E20', amberx: '#F59E0B' } } } };
  }
</script>
<style>
  :root { --forest:#1B5E20; --amber:#F59E0B; --ink:#14231a; }
  * { box-sizing: border-box; }
  body { margin:0; background:#EEF3EC; color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", Roboto, sans-serif; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .card { background:#fff; border-radius:16px; box-shadow:0 1px 3px rgba(0,0,0,.18); padding:14px; margin:12px; }
  .btn { min-height:48px; min-width:48px; padding:8px 14px; border-radius:12px; border:2px solid var(--forest); background:#fff; color:var(--forest); font-weight:700; font-size:15px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn-p { background:var(--forest); color:#fff; }
  .btn-a { background:var(--amber); border-color:var(--amber); color:#1c1300; }
  .btn-d { border-color:#B71C1C; color:#B71C1C; }
  .btn-sm { min-height:48px; padding:6px 12px; font-size:14px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn:focus-visible, .inp:focus-visible, .tabbtn:focus-visible { outline:3px solid var(--amber); outline-offset:2px; }
  .inp { width:100%; min-height:48px; padding:10px 12px; border:2px solid #7a9a80; border-radius:12px; font-size:16px; background:#fff; color:var(--ink); }
  textarea.inp { min-height:84px; }
  label.lbl { display:block; font-weight:700; margin:12px 0 4px; font-size:14px; }
  .hdr { position:sticky; top:0; z-index:30; background:var(--forest); color:#fff; display:flex; align-items:center; gap:6px; padding:8px 10px; }
  .hdr h1 { font-size:17px; margin:0; flex:1; line-height:1.15; }
  .hdr .btn { background:rgba(255,255,255,.12); color:#fff; border-color:#fff; }
  .nav { position:fixed; bottom:0; left:0; right:0; z-index:30; background:#fff; border-top:3px solid var(--forest); display:flex; padding-bottom:env(safe-area-inset-bottom); }
  .tabbtn { flex:1; min-height:60px; border:0; background:#fff; font-weight:700; font-size:13px; color:#375a3d; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .tabbtn[aria-selected="true"] { background:var(--forest); color:#fff; }
  .modal { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); display:none; align-items:flex-end; justify-content:center; }
  .modal.open { display:flex; }
  .sheet { background:#fff; width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:20px 20px 0 0; padding:16px; }
  @media (min-width:600px) { .modal { align-items:center; } .sheet { border-radius:20px; } }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .chip { min-height:48px; padding:6px 14px; border-radius:24px; border:2px solid var(--forest); background:#fff; color:var(--forest); font-weight:700; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--forest); color:#fff; }
  .catgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .cat { min-height:64px; border:2px solid #7a9a80; border-radius:12px; background:#fff; font-weight:700; font-size:13px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .cat[aria-pressed="true"] { background:#E8F5E9; border-color:var(--forest); box-shadow:0 0 0 2px var(--forest); }
  .hero { background:linear-gradient(160deg,#1B5E20,#2E7D32); color:#fff; }
  .bar { height:16px; border-radius:8px; background:rgba(255,255,255,.3); overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--amber); }
  .bar.win > i { background:#10B981; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .kv small { display:block; opacity:.85; font-size:12px; }
  .kv b { font-size:18px; }
  .stagebox { min-width:112px; border:2px solid #9bb59f; border-radius:12px; padding:8px; background:#fff; font-size:12px; }
  .stagebox.cur { border-color:var(--amber); background:#FFF7E0; box-shadow:0 0 0 2px var(--amber); }
  .tl { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:700; background:#E8F5E9; color:#1B5E20; }
  .badge.pending { background:#FFF3CD; color:#7a5200; }
  .badge.skipped { background:#e5e7eb; color:#374151; }
  .badge.credit { background:#FDE2E2; color:#9b1c1c; }
  .row { display:flex; gap:8px; align-items:flex-start; }
  .grow { flex:1; min-width:0; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .toast { position:fixed; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:70; background:#14231a; color:#fff; padding:12px 14px; border-radius:12px; display:none; font-weight:600; }
  .toast.show { display:block; }
  .err { color:#B71C1C; font-weight:700; margin-top:8px; min-height:1px; }
  .scroll { display:flex; gap:8px; overflow-x:auto; padding:2px 0; }
  .muted { color:#4b5b50; font-size:13px; }
  .thumb { width:56px; height:56px; object-fit:cover; border-radius:8px; border:2px solid #7a9a80; cursor:pointer; background:#fff; }
  details > summary { cursor:pointer; min-height:48px; display:flex; align-items:center; list-style:none; }
  details > summary::-webkit-details-marker { display:none; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header class="hdr">
  <h1 id="appTitle">🌾 KhetKhata &amp; Fasal Doctor</h1>
  <button class="btn btn-sm" id="btnExport" type="button" data-act="export" title="Export JSON" aria-label="Export JSON">⬇️</button>
  <button class="btn btn-sm" id="btnImport" type="button" data-act="import" title="Import JSON" aria-label="Import JSON">⬆️</button>
  <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  <button class="btn btn-sm" id="btnLang" type="button" data-act="lang" aria-label="Language">EN</button>
</header>

<main id="app" aria-live="polite"></main>

<nav class="nav" aria-label="Main">
  <button class="tabbtn" type="button" data-act="tab" data-tab="home" id="tab-home"></button>
  <button class="tabbtn" type="button" data-act="tab" data-tab="khata" id="tab-khata"></button>
  <button class="tabbtn" type="button" data-act="tab" data-tab="party" id="tab-party"></button>
  <button class="tabbtn" type="button" data-act="tab" data-tab="doctor" id="tab-doctor"></button>
</nav>
<div class="toast" id="toast" role="status"></div>

<!-- Plot modal -->
<div class="modal" id="plotModal" role="dialog" aria-modal="true" aria-labelledby="plotTitle">
  <form class="sheet" id="plotForm" novalidate>
    <h2 id="plotTitle" style="margin:0 0 4px;font-size:20px"></h2>
    <input type="hidden" id="plotId">
    <label class="lbl" for="plotName" data-i="plotName"></label>
    <input class="inp" id="plotName" maxlength="60" required>
    <label class="lbl" for="plotAcres" data-i="acreage"></label>
    <input class="inp" id="plotAcres" type="number" inputmode="decimal" step="0.01" min="0.01" required>
    <label class="lbl" for="plotCrop" data-i="crop"></label>
    <select class="inp" id="plotCrop"></select>
    <label class="lbl" for="plotSow" data-i="sowDate"></label>
    <input class="inp" id="plotSow" type="date" required>
    <label class="lbl" for="plotSeason" data-i="season"></label>
    <input class="inp" id="plotSeason" maxlength="30">
    <label class="lbl" for="plotBatai" data-i="batai"></label>
    <input class="inp" id="plotBatai" type="number" inputmode="decimal" min="0" max="100" step="1" placeholder="0">
    <p class="muted" data-i="rescaleNote"></p>
    <div class="err" id="plotErr"></div>
    <div class="acts"><button class="btn btn-p" type="submit" data-i="save"></button><button class="btn" type="button" data-act="close" data-modal="plotModal" data-i="cancel"></button></div>
  </form>
</div>

<!-- Task modal -->
<div class="modal" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="taskTitle">
  <form class="sheet" id="taskForm" novalidate>
    <h2 id="taskTitle" style="margin:0 0 4px;font-size:20px"></h2>
    <input type="hidden" id="taskId">
    <label class="lbl" for="taskName" data-i="taskName"></label>
    <input class="inp" id="taskName" maxlength="80">
    <label class="lbl" for="taskDay" data-i="targetDay"></label>
    <input class="inp" id="taskDay" type="number" inputmode="numeric" min="1" max="365" step="1">
    <label class="lbl" for="taskDose" data-i="dosage"></label>
    <input class="inp" id="taskDose" maxlength="140">
    <label class="lbl" for="taskCost" data-i="estCost"></label>
    <input class="inp" id="taskCost" type="number" inputmode="decimal" min="0" step="0.01">
    <label class="lbl" for="taskCat" data-i="category"></label>
    <select class="inp" id="taskCat"></select>
    <label class="lbl" for="taskStatus" data-i="status"></label>
    <select class="inp" id="taskStatus"></select>
    <div class="err" id="taskErr"></div>
    <div class="acts"><button class="btn btn-p" type="submit" data-i="save"></button><button class="btn" type="button" data-act="close" data-modal="taskModal" data-i="cancel"></button></div>
  </form>
</div>

<!-- Done quick-log modal -->
<div class="modal" id="doneModal" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <form class="sheet" id="doneForm" novalidate>
    <h2 id="doneTitle" style="margin:0 0 4px;font-size:20px" data-i="doneTitle"></h2>
    <p class="muted" id="doneTask"></p>
    <input type="hidden" id="doneTaskId">
    <label class="lbl" for="doneAmount" data-i="actualSpent"></label>
    <input class="inp" id="doneAmount" type="number" inputmode="decimal" min="0.01" step="0.01">
    <label class="lbl" data-i="payMode"></label>
    <div class="chips" id="doneMode"></div>
    <label class="lbl" for="doneParty" data-i="party"></label>
    <input class="inp" id="doneParty" list="partyList" maxlength="60" autocomplete="off">
    <label class="lbl" for="doneDate" data-i="date"></label>
    <input class="inp" id="doneDate" type="date">
    <div class="err" id="doneErr"></div>
    <div class="acts"><button class="btn btn-p" type="submit" data-i="saveDone"></button><button class="btn" type="button" data-act="close" data-modal="doneModal" data-i="cancel"></button></div>
  </form>
</div>

<!-- Entry drawer -->
<div class="modal" id="entryModal" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
  <form class="sheet" id="entryForm" novalidate>
    <h2 id="entryTitle" style="margin:0 0 4px;font-size:20px"></h2>
    <input type="hidden" id="entryId">
    <label class="lbl" data-i="entryType"></label>
    <div class="chips" id="entryTypes"></div>
    <label class="lbl" data-i="category"></label>
    <div class="catgrid" id="entryCats"></div>
    <label class="lbl" for="entryDate" data-i="date"></label>
    <input class="inp" id="entryDate" type="date" required>
    <label class="lbl" for="entryAmount" data-i="amount"></label>
    <input class="inp" id="entryAmount" type="number" inputmode="decimal" min="0.01" step="0.01" required>
    <div class="chips" id="entryChips"></div>
    <div id="modeWrap">
      <label class="lbl" data-i="payMode"></label>
      <div class="chips" id="entryModes"></div>
    </div>
    <div id="dirWrap" class="hidden">
      <label class="lbl" data-i="direction"></label>
      <div class="chips" id="entryDirs"></div>
    </div>
    <label class="lbl" for="entryParty" data-i="partyWorker"></label>
    <input class="inp" id="entryParty" list="partyList" maxlength="60" autocomplete="off">
    <datalist id="partyList"></datalist>
    <label class="lbl" for="entryNotes" data-i="notes"></label>
    <textarea class="inp" id="entryNotes" maxlength="400"></textarea>
    <div class="acts">
      <button class="btn" type="button" id="micBtn" data-act="mic"></button>
      <span class="muted" id="micStatus" aria-live="polite"></span>
    </div>
    <label class="lbl" for="entryFile" data-i="bill"></label>
    <input class="inp" id="entryFile" type="file" accept="image/*,application/pdf">
    <div class="row" id="attWrap" style="margin-top:8px"></div>
    <div class="err" id="entryErr"></div>
    <div class="acts"><button class="btn btn-p" type="submit" data-i="save"></button><button class="btn" type="button" data-act="close" data-modal="entryModal" data-i="cancel"></button></div>
  </form>
</div>

<!-- Settle modal -->
<div class="modal" id="settleModal" role="dialog" aria-modal="true" aria-labelledby="settleTitle">
  <form class="sheet" id="settleForm" novalidate>
    <h2 id="settleTitle" style="margin:0 0 4px;font-size:20px" data-i="settleTitle"></h2>
    <p id="settleInfo" style="font-weight:700"></p>
    <input type="hidden" id="settleKey">
    <label class="lbl" for="settleAmount" data-i="amount"></label>
    <input class="inp" id="settleAmount" type="number" inputmode="decimal" min="0.01" step="0.01">
    <label class="lbl" for="settleDate" data-i="date"></label>
    <input class="inp" id="settleDate" type="date">
    <div class="err" id="settleErr"></div>
    <div class="acts"><button class="btn btn-p" type="submit" data-i="settleSave"></button><button class="btn" type="button" data-act="close" data-modal="settleModal" data-i="cancel"></button></div>
  </form>
</div>

<!-- Viewer -->
<div class="modal" id="viewerModal" role="dialog" aria-modal="true" aria-label="Bill" style="align-items:center">
  <div style="width:100%;max-width:720px;padding:10px">
    <button class="btn btn-a" type="button" data-act="close" data-modal="viewerModal" data-i="close"></button>
    <div id="viewerBody" style="margin-top:8px;text-align:center"></div>
  </div>
</div>

<!-- Share modal -->
<div class="modal" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
  <div class="sheet">
    <h2 id="shareTitle" style="margin:0 0 4px;font-size:20px" data-i="shareTitle"></h2>
    <textarea class="inp" id="shareText" readonly style="min-height:200px"></textarea>
    <div class="acts">
      <button class="btn btn-p" type="button" data-act="wa" data-i="openWa"></button>
      <button class="btn" type="button" data-act="copy" data-i="copyText"></button>
      <button class="btn" type="button" data-act="close" data-modal="shareModal" data-i="close"></button>
    </div>
  </div>
</div>

  var g = $('#entryCats');
  g.innerHTML = CATS.map(function (c) { return '<button type="button" class="cat" data-v="' + c[0] + '" aria-pressed="' + (draft.cat === c[0]) + '"><span style="font-size:24px">' + c[1] + '</span>' + esc(t('cat_' + c[0])) + '</button>'; }).join('');
  g.onclick = function (ev) { var b = ev.target.closest('[data-v]'); if (!b) return; draft.cat = b.getAttribute('data-v'); if (draft.cat === 'fasal' && draft.type === 'expense') draft.type = 'income'; drawEntryForm(); };
  chipSet($('#entryModes'), [['cash', t('nagad')], ['credit', t('udhaar')]], draft.mode, function (v) { draft.mode = v; drawEntryForm(); });
  chipSet($('#entryDirs'), [['out', t('dirOut')], ['in', t('dirIn')]], draft.dir, function (v) { draft.dir = v; drawEntryForm(); });
  $('#modeWrap').classList.toggle('hidden', draft.type === 'payment');
  $('#dirWrap').classList.toggle('hidden', draft.type !== 'payment');
  $('#entryChips').innerHTML = [500, 1000, 2500].map(function (n) { return '<button type="button" class="chip" data-add="' + n + '">+₹' + n.toLocaleString('en-IN') + '</button>'; }).join('');
  $('#entryChips').onclick = function (ev) { var b = ev.target.closest('[data-add]'); if (!b) return; var cur = parseFloat($('#entryAmount').value) || 0; $('#entryAmount').value = r2(cur + parseInt(b.getAttribute('data-add'), 10)); };
  drawAtt();
}
function drawAtt() {
  var w = $('#attWrap'), a = draft.att;
  if (!a) { w.innerHTML = ''; return; }
  w.innerHTML = (a.kind === 'image' ? '<img class="thumb" alt="" src="' + esc(a.data) + '">' : '<span style="font-size:36px">📄</span>') +
    '<div class="grow"><div class="muted">' + t('replace') + '</div><button type="button" class="btn btn-sm btn-d" data-act="rmatt">' + t('removeAtt') + '</button></div>';
}
function showEntryForm(e) {
  stopMic();
  draft = e ? { type: e.type, cat: e.category, mode: e.mode, dir: e.dir || 'out', att: e.attachment || null } : { type: 'expense', cat: 'khad', mode: 'cash', dir: 'out', att: null };
  $('#entryTitle').textContent = e ? t('editEntry') : t('newEntry');
  $('#entryId').value = e ? e.id : '';
  $('#entryDate').value = e ? e.date : today();
  $('#entryAmount').value = e ? e.amount : '';
  $('#entryParty').value = e ? e.party || '' : '';
  $('#entryNotes').value = e ? e.notes || '' : '';
  $('#entryFile').value = '';
  $('#entryErr').textContent = ''; $('#micStatus').textContent = '';
  drawEntryForm();
  openM('entryModal');
}
function saveEntry(ev) {
  ev.preventDefault();
  var id = $('#entryId').value, amt = parseFloat($('#entryAmount').value), date = $('#entryDate').value, party = $('#entryParty').value.trim();
  var mode = draft.type === 'payment' ? 'cash' : draft.mode;
  var err = !(amt > 0) || !isFinite(amt) ? 'eAmount' : !parse(date) ? 'eDate' : ((mode === 'credit' || draft.type === 'payment') && !party) ? 'eParty' : (draft.type === 'expense' && draft.cat === 'fasal') ? 'eFasal' : '';
  if (err) { $('#entryErr').textContent = t(err); return; }
  var ok = commit(function () {
    var e = S.entries.filter(function (x) { return x.id === id; })[0];
    if (!e) { e = { id: uid(), plotId: S.activePlotId, taskId: null }; S.entries.push(e); }
    e.type = draft.type; e.category = draft.cat; e.date = date; e.amount = r2(amt); e.mode = mode; e.party = party;
    e.dir = draft.type === 'payment' ? draft.dir : 'out'; e.notes = $('#entryNotes').value.trim(); e.attachment = draft.att;
  });
  if (ok) closeM('entryModal');
}
function compress(file) {
  return new Promise(function (res, rej) {
    if (file.type === 'application/pdf') {
      if (file.size > 400 * 1024) return rej(new Error('big'));
      var fr = new FileReader(); fr.onload = function () { res({ kind: 'pdf', data: fr.result }); }; fr.onerror = function () { rej(new Error('read')); }; fr.readAsDataURL(file); return;
    }
    if (!/^image\//.test(file.type)) return rej(new Error('type'));
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var max = 1000, w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, max / Math.max(w, h));
      w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res({ kind: 'image', data: c.toDataURL('image/jpeg', 0.65) });
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function onFile() {
  var f = $('#entryFile').files[0]; if (!f) return;
  compress(f).then(function (a) { draft.att = a; $('#entryErr').textContent = ''; drawAtt(); }, function () { $('#entryErr').textContent = t('attBad'); $('#entryFile').value = ''; });
}
function stopMic() {
  clearTimeout(recogTimer);
  if (recog) { var r = recog; recog = null; try { r.onresult = r.onerror = r.onend = null; r.abort(); } catch (e) { /* ignore */ } }
  $('#micBtn').textContent = t('mic');
  if ($('#micStatus').textContent === t('micListening')) $('#micStatus').textContent = '';
}
function toggleMic() {
  if (recog) { try { recog.stop(); } catch (e) { stopMic(); } return; }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $('#micStatus').textContent = t('micNo'); return; }
  try {
    var r = new SR(); recog = r;
    r.lang = 'hi-IN'; r.interimResults = false; r.continuous = false;
    r.onresult = function (ev) {
      var txt = ''; for (var i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) txt += ev.results[i][0].transcript + ' ';
      txt = txt.trim(); if (txt) { var n = $('#entryNotes'); n.value = (n.value ? n.value.trim() + ' ' : '') + txt; }
    };
    r.onerror = function (ev) { $('#micStatus').textContent = t('micErr', { e: ev && ev.error ? ev.error : '?' }); };
    r.onend = function () { var msg = $('#micStatus').textContent; recog = null; clearTimeout(recogTimer); $('#micBtn').textContent = t('mic'); if (msg === t('micListening')) $('#micStatus').textContent = ''; };
    r.start();
    $('#micBtn').textContent = t('micStop'); $('#micStatus').textContent = t('micListening');
    recogTimer = setTimeout(function () { try { r.stop(); } catch (e) { stopMic(); } }, 20000);
  } catch (e) { recog = null; clearTimeout(recogTimer); $('#micBtn').textContent = t('mic'); $('#micStatus').textContent = t('micErr', { e: 'start' }); }
}

/* ================= party actions ================= */
function partyByKey(k) { var p = activePlot(); return p ? parties(p.id).filter(function (x) { return x.key === k; })[0] : null; }
function statementText(q) {
  var p = activePlot(), L = [];
  L.push('*' + p.name + ' — ' + t('stHdr') + '*');
  L.push(t('stName') + ': ' + q.name);
  L.push(t('date') + ': ' + fmtD(today()));
  L.push('------------');
  q.rows.forEach(function (e) {
    var lbl = e.type === 'payment' ? (e.dir === 'in' ? t('stRecvd') : t('stPaid')) : e.type === 'income' ? t('stRecv') : t('stKaam');
    var tail = e.type === 'expense' ? t('cat_' + e.category).split(' ')[0] : '';
    L.push(fmtD(e.date) + ' | ' + lbl + (tail ? ' (' + tail + ')' : '') + (e.notes ? ' - ' + e.notes : '') + ' | ' + money(e.amount));
  });
  L.push('------------');
  if (q.bill || q.paid) { L.push(t('stTotalBill') + ': ' + money(q.bill)); L.push(t('stTotalPaid') + ': ' + money(q.paid)); L.push(t('stBaki') + ': ' + (q.baki <= 0 && q.bill > 0 ? t('chukta') : money(Math.max(q.baki, 0)))); }
  if (q.recvBill || q.recvIn) { L.push(t('stRecv') + ': ' + money(q.recvBill)); L.push(t('stRecvd') + ': ' + money(q.recvIn)); L.push(t('lenaBaki') + ': ' + money(Math.max(q.lena, 0))); }
  return L.join('\n');
}
function showSettle(q) {
  var out = q.baki > 0, amt = out ? q.baki : q.lena;
  $('#settleKey').value = q.key;
  $('#settleInfo').textContent = t('settleInfo', { n: q.name, a: money(amt) }) + ' (' + (out ? t('dirOut') : t('dirIn')) + ')';
  $('#settleAmount').value = amt;
  $('#settleDate').value = today();
  $('#settleErr').textContent = '';
  openM('settleModal');
}
function saveSettle(ev) {
  ev.preventDefault();
  var q = partyByKey($('#settleKey').value); if (!q) return;
  var out = q.baki > 0, max = out ? q.baki : q.lena, amt = parseFloat($('#settleAmount').value), date = $('#settleDate').value;
  var err = !(amt > 0) || !isFinite(amt) ? 'eAmount' : !parse(date) ? 'eDate' : r2(amt) > max ? 'eOver' : '';
  if (err) { $('#settleErr').textContent = t(err); return; }
  var ok = commit(function () {
    S.entries.push({ id: uid(), plotId: S.activePlotId, type: 'payment', category: out ? q.cat : 'fasal', date: date, amount: r2(amt), mode: 'cash', party: q.name, notes: t('settleTitle'), attachment: null, taskId: null, dir: out ? 'out' : 'in' });
    openParties[q.key] = true;
  });
  if (ok) closeM('settleModal');
}

/* ================= misc actions ================= */
function speak(k) {
  var p = activePlot();
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') { toast(t('noSpeech')); return; }
  try {
    var item = k.item ? k.item.hi : '', si = stageOf(k.day);
    var line = TTL(k, item, p);
    var u = new SpeechSynthesisUtterance(line); u.lang = 'hi-IN'; u.rate = 0.9;
    var v = speechSynthesis.getVoices().filter(function (x) { return /^hi/i.test(x.lang); })[0]; if (v) u.voice = v;
    u.onerror = function () { toast(t('noSpeech')); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { toast(t('noSpeech')); }
}
function TTL(k, item, p) {
  var si = stageOf(k.day), title = k.name || T['stage' + (si + 1)][0];
  var dose = k.doseText || (k.kind === 'kg' ? k.qty + ' किलो ' + item + ', यानी ' + k.perAcre + ' किलो प्रति एकड़' : k.kind === 'tank' ? item + ', ' + k.qty + ' टंकी बीस लीटर की' : k.kind === 'acre' ? item + ', ' + k.qty + ' एकड़' : '');
  return title + '. ' + dose + '. ' + 'अनुमानित खर्च ' + Math.round(k.cost) + ' रुपये। दवा डालने से पहले लेबल ज़रूर पढ़ें।';
}
function doExport() {
  try {
    var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'khetkhata-backup-' + today() + '.json';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast(t('exported'));
  } catch (e) { toast(t('storageFail')); }
}
function doImport(file) {
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function () {
    var o, err;
    try { o = JSON.parse(fr.result); err = validate(o); } catch (e) { err = 'JSON'; }
    if (err) { toast(t('importBad', { e: err })); return; }
    if (!confirm(t('confirmImport'))) return;
    var keepLang = S.lang;
    commit(function () { S = o; if (!S.lang) S.lang = keepLang; if (!S.activePlotId && S.plots.length) S.activePlotId = S.plots[0].id; });
    if (storageOK) toast(t('imported'));
  };
  fr.onerror = function () { toast(t('importBad', { e: 'read' })); };
  fr.readAsText(file);
}
function copyText() {
  var txt = $('#shareText').value;
  function fallback() {
    var ta = $('#shareText');
    try { ta.focus(); ta.select(); toast(document.execCommand('copy') ? t('copied') : t('copyFail')); } catch (e) { toast(t('copyFail')); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast(t('copied')); }, fallback); else fallback();
}

/* ================= events ================= */
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act'), id = b.getAttribute('data-id'), p = activePlot(), k;
  switch (a) {
    case 'lang': commit(function () { S.lang = lang() ? 'hi' : 'en'; }); break;
    case 'tab': tab = b.getAttribute('data-tab'); render(); window.scrollTo(0, 0); break;
    case 'selplot': commit(function () { S.activePlotId = id; }); break;
    case 'addplot': showPlotForm(null); break;
    case 'editplot': if (p) showPlotForm(p); break;
    case 'delplot':
      if (!p) break;
      var tc = S.tasks.filter(function (x) { return x.plotId === p.id; }).length, ec = entriesOf(p.id).length;
      if (confirm(t('confirmDelPlot', { n: p.name, t: tc, e: ec }))) commit(function () {
        S.plots = S.plots.filter(function (x) { return x.id !== p.id; });
        S.tasks = S.tasks.filter(function (x) { return x.plotId !== p.id; });
        S.entries = S.entries.filter(function (x) { return x.plotId !== p.id; });
        S.activePlotId = S.plots.length ? S.plots[0].id : null;
      });
      break;
    case 'addtask': showTaskForm(null); break;
    case 'edittask': k = S.tasks.filter(function (x) { return x.id === id; })[0]; if (k) showTaskForm(k); break;
    case 'deltask': if (confirm(t('confirmDelTask'))) commit(function () { S.tasks = S.tasks.filter(function (x) { return x.id !== id; }); }); break;
    case 'done': k = S.tasks.filter(function (x) { return x.id === id; })[0]; if (k) showDone(k); break;
    case 'speak': k = S.tasks.filter(function (x) { return x.id === id; })[0]; if (k) speak(k); break;
    case 'addentry': showEntryForm(null); break;
    case 'editentry': var e1 = S.entries.filter(function (x) { return x.id === id; })[0]; if (e1) showEntryForm(e1); break;
    case 'delentry':
      if (confirm(t('confirmDelEntry'))) commit(function () {
        S.entries = S.entries.filter(function (x) { return x.id !== id; });
        S.tasks.forEach(function (x) { if (x.entryId === id) { x.entryId = null; x.status = 'pending'; } });
      });
      break;
    case 'viewatt':
      var e2 = S.entries.filter(function (x) { return x.id === id; })[0];
      if (e2 && e2.attachment) {
        $('#viewerBody').innerHTML = e2.attachment.kind === 'image' ? '<img alt="Bill" style="max-width:100%;max-height:80vh;border-radius:8px;background:#fff" src="' + esc(e2.attachment.data) + '">' : '<iframe title="Bill" style="width:100%;height:80vh;background:#fff;border:0" src="' + esc(e2.attachment.data) + '"></iframe>';
        openM('viewerModal');
      }
      break;
    case 'rmatt': draft.att = null; $('#entryFile').value = ''; drawAtt(); break;
    case 'mic': toggleMic(); break;
    case 'share': var q = partyByKey(b.getAttribute('data-key')); if (q) { var txt = statementText(q); $('#shareText').value = txt; shareLink = 'https://wa.me/?text=' + encodeURIComponent(txt); openM('shareModal'); } break;
    case 'wa': window.open(shareLink, '_blank', 'noopener'); break;
    case 'copy': copyText(); break;
    case 'settle': var q2 = partyByKey(b.getAttribute('data-key')); if (q2) showSettle(q2); break;
    case 'persist':
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function (ok) { toast(t(ok ? 'dPersistOk' : 'dPersistNo')); }, function () { toast(t('dPersistNo')); });
      else toast(t('dPersistNo'));
      break;
    case 'export': doExport(); break;
    case 'import': $('#importFile').value = ''; $('#importFile').click(); break;
    case 'close': closeM(b.getAttribute('data-modal')); break;
  }
});
document.addEventListener('toggle', function (ev) { var d = ev.target; if (d.tagName === 'DETAILS' && d.dataset.key) { if (d.open) openParties[d.dataset.key] = true; else delete openParties[d.dataset.key]; } }, true);
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') document.querySelectorAll('.modal.open').forEach(function (m) { closeM(m.id); }); });
document.querySelectorAll('.modal').forEach(function (m) { m.addEventListener('mousedown', function (ev) { if (ev.target === m) closeM(m.id); }); });
$('#plotForm').addEventListener('submit', savePlot);
$('#taskForm').addEventListener('submit', saveTask);
$('#doneForm').addEventListener('submit', saveDone);
$('#entryForm').addEventListener('submit', saveEntry);
$('#settleForm').addEventListener('submit', saveSettle);
$('#entryFile').addEventListener('change', onFile);
$('#importFile').addEventListener('change', function () { doImport(this.files[0]); });

load();
render();
window.KhetKhata = { validate: validate, state: function () { return S; } };
})();
</script>
</body>
